apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-warning-alerter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-warning-alerter
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-warning-alerter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-warning-alerter
subjects:
  - kind: ServiceAccount
    name: k8s-warning-alerter
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-warning-alerter
  namespace: monitoring
  labels:
    app: k8s-warning-alerter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-warning-alerter
  template:
    metadata:
      labels:
        app: k8s-warning-alerter
    spec:
      serviceAccountName: k8s-warning-alerter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: alerter
          image: your-registry/k8s-warning-alerter:latest
          imagePullPolicy: Always
          env:
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-warning-alerter-secrets
                  key: sendgrid-api-key
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: k8s-warning-alerter-secrets
                  key: sendgrid-from-email
            - name: SENDGRID_TO_EMAILS
              valueFrom:
                secretKeyRef:
                  name: k8s-warning-alerter-secrets
                  key: sendgrid-to-emails
            - name: CLUSTER_NAME
              value: "my-cluster"
            - name: LOG_LEVEL
              value: "INFO"
            - name: MAX_EVENT_AGE_SECONDS
              value: "180"
            - name: EVENT_COOLDOWN_SECONDS
              value: "1800"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
